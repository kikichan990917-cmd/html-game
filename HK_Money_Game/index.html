<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港貨幣小達人</title>
  <style>
    :root {
      --primary-color: #ff6b6b;
      --secondary-color: #4ecdc4;
      --accent-color: #ffe66d;
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: "Chalkboard SE", "Comic Sans MS", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.12);
      padding: 25px;
      text-align: center;
      position: relative;
      border: 4px solid var(--secondary-color);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .badge {
      background: var(--accent-color);
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 1.1rem;
      box-shadow: 0 3px 0 rgba(0,0,0,0.1);
    }

    .question-box {
      background: #eef9f8;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 20px;
      border: 3px dashed var(--secondary-color);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .question-text {
      font-size: 1.6rem;
      color: #1a535c;
      font-weight: bold;
    }

    .speaker-btn {
      background: var(--primary-color);
      border: none;
      border-radius: 50%;
      width: 52px;
      height: 52px;
      font-size: 1.6rem;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 0 #d63031;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.1s;
    }

    .speaker-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #d63031;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .option-card {
      background: #fff;
      border: 4px solid #e0e0e0;
      border-radius: 20px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 160px;
      box-shadow: 0 5px 0 #e0e0e0;
      position: relative;
      overflow: hidden;
    }

    .option-card:hover {
      transform: translateY(-3px);
      border-color: var(--secondary-color);
    }

    .option-card.correct {
      border-color: #2ecc71 !important;
      background-color: #e8f8f5 !important;
      box-shadow: 0 5px 0 #27ae60 !important;
    }

    .option-card.wrong {
      border-color: #e74c3c !important;
      background-color: #fadbd8 !important;
      box-shadow: 0 5px 0 #c0392b !important;
    }

    .img-wrapper {
      width: 100%;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .currency-img {
      max-width: 100%;
      max-height: 110px;
      object-fit: contain;
      filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.25));
    }

    /* 將缺圖提示字元縮至極小並藏在按鈕層次後方 */
    .hidden-fallback-text {
      position: absolute;
      top: 0;
      left: 0;
      font-size: 1px !important;
      line-height: 1px !important;
      color: transparent !important;
      opacity: 0 !important;
      z-index: -10 !important;
      pointer-events: none !important;
      user-select: none !important;
      visibility: hidden !important;
      overflow: hidden;
      width: 0;
      height: 0;
    }

    .btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 14px 36px;
      font-size: 1.4rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 0 #d63031;
      transition: all 0.1s;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #d63031;
    }

    /* 重溫清單區塊：清晰排版與美化滾動（下拉）條 */
    .review-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 20px 0;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 8px;
    }

    .review-list::-webkit-scrollbar {
      width: 8px;
    }

    .review-list::-webkit-scrollbar-track {
      background: #eef4f8;
      border-radius: 10px;
    }

    .review-list::-webkit-scrollbar-thumb {
      background: var(--secondary-color);
      border-radius: 10px;
    }

    .review-item {
      background: #ffffff;
      border: 2px solid #e0e6ed;
      border-radius: 18px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
      position: relative;
    }

    .review-info {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .review-preview {
      width: 120px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: #f8fafc;
      border-radius: 10px;
      padding: 4px;
    }

    .review-preview .currency-img {
      max-width: 100%;
      max-height: 72px;
      object-fit: contain;
    }

    .sm-btn {
      background: var(--secondary-color);
      border: none;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      font-size: 1.2rem;
      color: white;
      cursor: pointer;
      box-shadow: 0 3px 0 #3baba3;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 500px) {
      .options-grid { grid-template-columns: 1fr; }
      .option-card { min-height: 130px; }
      .question-text { font-size: 1.3rem; }
      .review-preview { width: 90px; height: 65px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 開始畫面 -->
    <div id="start-screen" style="padding: 30px 0;">
      <h1 style="font-size: 2.6rem; color: var(--primary-color); margin-bottom: 35px;">香港貨幣小達人</h1>
      <button class="btn" onclick="startGame()">開始遊戲</button>
    </div>

    <!-- 遊戲進行畫面 -->
    <div id="game-screen" class="hidden">
      <div class="header-bar">
        <span class="badge" id="progress-text">第 1 / 20 題</span>
        <span class="badge" style="background: #a8e6cf;" id="score-text">得分：0</span>
      </div>

      <div class="question-box">
        <span class="question-text" id="question-label">請找出...</span>
        <button class="speaker-btn" onclick="playQuestionSpeech()" title="朗讀題目">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        </button>
      </div>

      <div class="options-grid" id="options-container">
        <!-- 動態產生選項 -->
      </div>
    </div>

    <!-- 遊戲結束/重溫畫面 -->
    <div id="result-screen" class="hidden">
      <h2 style="font-size: 2rem; color: var(--primary-color);">挑戰完成！</h2>
      <p id="final-score" style="font-size: 1.4rem; margin: 10px 0; font-weight: bold;"></p>

      <h3 style="text-align: left; margin-top: 15px; color: #2d3436;">貨幣圖樣重溫：</h3>
      <div class="review-list" id="review-list">
        <!-- 動態產生重溫項目 -->
      </div>

      <button class="btn" onclick="startGame()" style="margin-top: 10px;">再玩一次</button>
    </div>
  </div>

  <script>
    /* 1. 本地圖片資料庫 */
    const CURRENCY_DATA = [
      { id: 'coin_10c',  name: '一毫硬幣',   val: '1毫', type: 'coin', speech: '一毫硬幣', img: 'images/coin_10c.jpg' },
      { id: 'coin_20c',  name: '二毫硬幣',   val: '2毫', type: 'coin', speech: '二毫硬幣', img: 'images/coin_20c.jpg' },
      { id: 'coin_50c',  name: '五毫硬幣',   val: '5毫', type: 'coin', speech: '五毫硬幣', img: 'images/coin_50c.jpg' },
      { id: 'coin_1d',   name: '一元硬幣',   val: '$1',   type: 'coin', speech: '一元硬幣', img: 'images/coin_1d.jpg' },
      { id: 'coin_2d',   name: '二元硬幣',   val: '$2',   type: 'coin', speech: '二元硬幣', img: 'images/coin_2d.jpg' },
      { id: 'coin_5d',   name: '五元硬幣',   val: '$5',   type: 'coin', speech: '五元硬幣', img: 'images/coin_5d.jpg' },
      { id: 'coin_10d',  name: '十元硬幣',   val: '$10',  type: 'coin', speech: '十元硬幣', img: 'images/coin_10d.jpg' },

      { id: 'note_10d',   name: '十元紙幣',   val: '$10',   type: 'note', speech: '十元紙幣',   img: 'images/note_10d.jpg', theme: '塑膠/法定鈔票' },
      { id: 'note_20d',   name: '二十元紙幣', val: '$20',   type: 'note', speech: '二十元紙幣', img: 'images/note_20d.jpg', theme: '2018系列：飲茶文化' },
      { id: 'note_50d',   name: '五十元紙幣', val: '$50',   type: 'note', speech: '五十元紙幣', img: 'images/note_50d.jpg', theme: '2018系列：蝴蝶與花卉' },
      { id: 'note_100d',  name: '一百元紙幣', val: '$100',  type: 'note', speech: '一百元紙幣', img: 'images/note_100d.jpg', theme: '2018系列：粵劇' },
      { id: 'note_500d',  name: '五百元紙幣', val: '$500',  type: 'note', speech: '五百元紙幣', img: 'images/note_500d.jpg', theme: '2018系列：地質公園' },
      { id: 'note_1000d', name: '一千元紙幣', val: '$1000', type: 'note', speech: '一千元紙幣', img: 'images/note_1000d.jpg', theme: '2018系列：金融都市' }
    ];

    /* 2. 備用 SVG 防破圖機制 */
    function getFallbackSVGById(id) {
      const item = CURRENCY_DATA.find(i => i.id === id);
      if (!item) return '';

      if (item.type === 'coin') {
        let bg = item.id.includes('c') ? '#E6C200' : '#D8D8D8';
        return `
          <svg viewBox="0 0 100 100" width="80" height="80">
            <circle cx="50" cy="50" r="44" fill="${bg}" stroke="#888" stroke-width="3"/>
            <text x="50" y="58" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">${item.val}</text>
            <text x="50" y="95" font-size="1px" fill="transparent" opacity="0">缺圖片檔</text>
          </svg>
          <span class="hidden-fallback-text">缺圖片檔</span>
        `;
      } else {
        return `
          <svg viewBox="0 0 200 100" width="160" height="80">
            <rect width="200" height="100" rx="6" fill="#4A90E2" stroke="#fff" stroke-width="2"/>
            <text x="100" y="58" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">${item.val}</text>
            <text x="100" y="95" font-size="1px" fill="transparent" opacity="0">請將圖片放入 images 資料夾</text>
          </svg>
          <span class="hidden-fallback-text">請將圖片放入 images 資料夾</span>
        `;
      }
    }

    function renderCurrencyMedia(item) {
      return `
        <img src="${item.img}" class="currency-img" alt="" 
             onerror="this.onerror=null; this.parentElement.innerHTML=getFallbackSVGById('${item.id}');">
      `;
    }

    /* 3. 音效機制 */
    const TOTAL_ROUNDS = 20;
    let currentRound = 0;
    let score = 0;
    let playedQuestions = [];
    let currentTarget = null;
    let audioCtx = null;

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(type) {
      initAudioContext();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      if (type === 'correct') {
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.12);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.setValueAtTime(160, now + 0.15);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      }
    }

    /* 4. 廣東話語音 */
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-HK';
        utterance.rate = 0.85;

        const voices = window.speechSynthesis.getVoices();
        const hkVoice = voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh_HK');
        if (hkVoice) {
          utterance.voice = hkVoice;
        }
        window.speechSynthesis.speak(utterance);
      }
    }

    function playQuestionSpeech() {
      if (currentTarget) {
        speakText(`請找出${currentTarget.speech}`);
      }
    }

    /* 5. 遊戲流程 */
    function startGame() {
      initAudioContext();
      currentRound = 0;
      score = 0;
      playedQuestions = [];

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');

      nextQuestion();
    }

    function nextQuestion() {
      if (currentRound >= TOTAL_ROUNDS) {
        showResultScreen();
        return;
      }

      currentRound++;
      document.getElementById('progress-text').innerText = `第 ${currentRound} / ${TOTAL_ROUNDS} 題`;
      document.getElementById('score-text').innerText = `得分：${score}`;

      let available = CURRENCY_DATA.filter(item => !playedQuestions.includes(item));
      if (available.length === 0) {
        available = CURRENCY_DATA.filter(item => item.id !== (currentTarget ? currentTarget.id : null));
      }

      currentTarget = available[Math.floor(Math.random() * available.length)];
      playedQuestions.push(currentTarget);

      document.getElementById('question-label').innerText = `請找出「${currentTarget.name}」`;
      setTimeout(playQuestionSpeech, 200);

      const options = [currentTarget];
      const wrongPool = CURRENCY_DATA.filter(item => item.id !== currentTarget.id);
      wrongPool.sort(() => Math.random() - 0.5);
      for (let i = 0; i < 3; i++) {
        options.push(wrongPool[i]);
      }
      options.sort(() => Math.random() - 0.5);

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      options.forEach(item => {
        const card = document.createElement('div');
        card.className = 'option-card';
        card.dataset.id = item.id;
        card.onclick = () => handleAnswer(item.id, card);

        card.innerHTML = `
          <div class="img-wrapper">
            ${renderCurrencyMedia(item)}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function handleAnswer(selectedId, cardElement) {
      const cards = document.querySelectorAll('.option-card');
      cards.forEach(c => c.style.pointerEvents = 'none');

      if (selectedId === currentTarget.id) {
        playSound('correct');
        cardElement.classList.add('correct');
        score += 5;
        document.getElementById('score-text').innerText = `得分：${score}`;
      } else {
        playSound('wrong');
        cardElement.classList.add('wrong');
        cards.forEach(c => {
          if (c.dataset.id === currentTarget.id) {
            c.classList.add('correct');
          }
        });
      }

      setTimeout(nextQuestion, 1400);
    }

    /* 6. 結算畫面 */
    function showResultScreen() {
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');

      document.getElementById('final-score').innerText = `最終得分：${score} 分！`;

      const reviewContainer = document.getElementById('review-list');
      reviewContainer.innerHTML = '';

      const uniquePlayed = Array.from(new Set(playedQuestions));

      uniquePlayed.forEach(item => {
        const itemRow = document.createElement('div');
        itemRow.className = 'review-item';

        itemRow.innerHTML = `
          <div class="review-info">
            <div class="review-preview">
              ${renderCurrencyMedia(item)}
            </div>
            <div style="text-align: left;">
              <div style="font-size: 1.25rem; font-weight: bold; color: #2c3e50; margin-bottom: 4px;">${item.name}</div>
              <div style="font-size: 0.95rem; color: #64748b; font-weight: 500;">${item.type === 'note' ? item.theme : '香港法定流通硬幣'}</div>
            </div>
          </div>
          <button class="sm-btn" onclick="speakText('${item.speech}')" title="發音">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
          </button>
        `;

        reviewContainer.appendChild(itemRow);
      });

      const endPhrases = ['完成啦！', '成功啦！', '好叻呀！'];
      const randomPhrase = endPhrases[Math.floor(Math.random() * endPhrases.length)];
      speakText(`${randomPhrase} 你完成了遊戲，得到${score}分！`);
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }
  </script>
</body>
</html>
